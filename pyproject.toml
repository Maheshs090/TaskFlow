[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "1.0.0"
description = "A fast command-line task manager"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
taskflow = "taskflow.cli:main"

[tool.setuptools]
packages = ["taskflow"]
